version: '3.8'

services:
  agent-service:
    build: 
      context: ./agents
      dockerfile: Dockerfile
    container_name: archieos-agent-service
    volumes:
      - ./agents:/app
      - ./external/openai-agents-python:/app/external/openai-agents-python:ro
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=local
      - LOG_LEVEL=debug
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
      - DYNAMODB_ENDPOINT=http://archieos-localstack:4566
      - BACKEND_URL=http://archieos-backend-dev:3000
      - AGENT_SERVICE_PORT=8000
      - TRACE_ENABLED=true
      - RATE_LIMIT_REQUESTS_PER_MINUTE=60
      # Matrix config (for P3)
      - PROCESSED_EVENTS_TABLE=processed_events
      - MATRIX_APP_SERVICE_TOKEN=${MATRIX_APP_SERVICE_TOKEN}
      - MATRIX_MCP_URL=http://matrix-mcp-server:3001/mcp
      - MATRIX_USER_ID=${MATRIX_USER_ID:-@archie:localhost}
      # SQS config (for P3)
      - SQS_QUEUE_URL=http://archieos-localstack:4566/000000000000/prompt-queue.fifo
      - SQS_DLQ_URL=http://archieos-localstack:4566/000000000000/prompt-queue-dlq.fifo
    depends_on:
      - localstack
      - matrix-synapse
    command: python -m uvicorn src.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Matrix Synapse server
  matrix-synapse:
    image: matrixdotorg/synapse:latest
    container_name: archieos-matrix-synapse
    environment:
      - SYNAPSE_SERVER_NAME=localhost
      - SYNAPSE_REPORT_STATS=no
      - SYNAPSE_ENABLE_REGISTRATION=yes
      - SYNAPSE_NO_TLS=yes
    volumes:
      - ./data/matrix/synapse:/data
    ports:
      - "8008:8008"
      - "8448:8448"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/_matrix/client/versions"]
      interval: 30s
      timeout: 10s
      retries: 3
  
  # Matrix MCP Server for Archie's Matrix output
  matrix-mcp-server:
    build: ./external/matrix-mcp-server
    container_name: archieos-matrix-mcp-server
    ports:
      - "3001:3001"
    environment:
      # Core Configuration
      - PORT=3001
      - ENABLE_OAUTH=false
      - ENABLE_TOKEN_EXCHANGE=false
      - CORS_ALLOWED_ORIGINS=
      # Matrix Configuration
      - MATRIX_HOMESERVER_URL=http://matrix-synapse:8008
      - MATRIX_DOMAIN=localhost
      - MATRIX_CLIENT_ID=archieos-mcp
      - MATRIX_CLIENT_SECRET=archieos-mcp-secret
      # Pass Matrix access token
      - MATRIX_USER_ID=${MATRIX_USER_ID:-@archie:localhost}
      - MATRIX_ACCESS_TOKEN=${MATRIX_ACCESS_TOKEN}
    depends_on:
      - matrix-synapse
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3

  # Queue consumer service (Prompt Queue → Archie)
  queue-consumer:
    build: 
      context: ./agents
      dockerfile: Dockerfile
    container_name: archieos-queue-consumer
    volumes:
      - ./agents:/app
      - ./external/openai-agents-python:/app/external/openai-agents-python:ro
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
      - LOCALSTACK_ENDPOINT=http://archieos-localstack:4566
      - BACKEND_URL=http://archieos-backend-dev:3000
      - SQS_QUEUE_URL=http://archieos-localstack:4566/000000000000/prompt-queue.fifo
      - SQS_DLQ_URL=http://archieos-localstack:4566/000000000000/prompt-queue-dlq.fifo
      - LAUREN_WORK_QUEUE_URL=http://archieos-localstack:4566/000000000000/lauren-work-queue.fifo
      - MATRIX_EVENTS_TABLE=matrix_events
      - PROCESSED_EVENTS_TABLE=processed_events
      # Matrix MCP config
      - MATRIX_HOMESERVER_URL=${MATRIX_HOMESERVER_URL:-http://matrix-synapse:8008}
      - MATRIX_ACCESS_TOKEN=${MATRIX_ACCESS_TOKEN}
      - MATRIX_MCP_URL=http://matrix-mcp-server:3001/mcp
      - MATRIX_USER_ID=${MATRIX_USER_ID:-@archie:localhost}
    depends_on:
      - agent-service
      - matrix-mcp-server
    command: >
      sh -c "
        echo 'Waiting for infrastructure...' &&
        sleep 20 &&
        echo 'Starting Archie (Prompt Queue consumer)...' &&
        python -u -m src.queue_consumer || (echo 'Queue consumer failed with exit code: $?' && exit 1)
      "

  # Lauren Work Queue consumer (Archie → Lauren)
  lauren-consumer:
    build:
      context: ./agents
      dockerfile: Dockerfile
    container_name: archieos-lauren-consumer
    volumes:
      - ./agents:/app
      - ./external/openai-agents-python:/app/external/openai-agents-python:ro
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
      - LOCALSTACK_ENDPOINT=http://archieos-localstack:4566
      - BACKEND_URL=http://archieos-backend-dev:3000
      - LAUREN_WORK_QUEUE_URL=http://archieos-localstack:4566/000000000000/lauren-work-queue.fifo
      - LAUREN_WORK_QUEUE_DLQ_URL=http://archieos-localstack:4566/000000000000/lauren-work-queue-dlq.fifo
      - ARCHIE_SIGNAL_QUEUE_URL=http://archieos-localstack:4566/000000000000/archie-signal-queue.fifo
      - PROCESSED_EVENTS_TABLE=processed_events
      - agent-service
    command: >
      sh -c "
        echo 'Waiting for infrastructure...' &&
        sleep 25 &&
        echo 'Starting Lauren (Work Queue consumer)...' &&
        python -m src.lauren_consumer
      "

  # Matrix listener (Matrix → Prompt Queue)
  matrix-listener:
    build:
      context: ./agents
      dockerfile: Dockerfile
    container_name: archieos-matrix-listener
    volumes:
      - ./agents:/app
      - ./external/openai-agents-python:/app/external/openai-agents-python:ro
    environment:
      - MATRIX_HOMESERVER_URL=http://matrix-synapse:8008
      - MATRIX_ACCESS_TOKEN=${MATRIX_ACCESS_TOKEN}
      - MATRIX_USER_ID=${MATRIX_USER_ID:-@archie:localhost}
      - SQS_QUEUE_URL=http://archieos-localstack:4566/000000000000/prompt-queue.fifo
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
      - LOCALSTACK_ENDPOINT=http://archieos-localstack:4566
      - MATRIX_EVENTS_TABLE=matrix_events
      - PROCESSED_EVENTS_TABLE=processed_events
    depends_on:
      - matrix-synapse
      - localstack
    command: >
      sh -c "
        echo 'Waiting for Matrix and infrastructure...' &&
        sleep 30 &&
        echo 'Starting Matrix listener...' &&
        python -u scripts/matrix_listener.py
      "

  # Archie Signal Queue consumer (Lauren → Archie)
  archie-signal-consumer:
    build:
      context: ./agents
      dockerfile: Dockerfile
    container_name: archieos-archie-signal-consumer
    volumes:
      - ./agents:/app
      - ./external/openai-agents-python:/app/external/openai-agents-python:ro
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
      - LOCALSTACK_ENDPOINT=http://archieos-localstack:4566
      - BACKEND_URL=http://archieos-backend-dev:3000
      - ARCHIE_SIGNAL_QUEUE_URL=http://archieos-localstack:4566/000000000000/archie-signal-queue.fifo
      - ARCHIE_SIGNAL_QUEUE_DLQ_URL=http://archieos-localstack:4566/000000000000/archie-signal-queue-dlq.fifo
      - MATRIX_HOMESERVER_URL=${MATRIX_HOMESERVER_URL:-http://matrix-synapse:8008}
      - MATRIX_ACCESS_TOKEN=${MATRIX_ACCESS_TOKEN}
      - PROCESSED_EVENTS_TABLE=processed_events
      - agent-service
      - matrix-synapse
    command: >
      sh -c "
        echo 'Waiting for infrastructure...' &&
        sleep 30 &&
        echo 'Starting Archie Signal consumer...' &&
        python -m src.archie_signal_consumer
      "

networks:
  default:
    external:
      name: archieosbackend_default
