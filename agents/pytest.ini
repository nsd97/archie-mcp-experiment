[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Ignore vendored SDK tests
norecursedirs = external .git .tox dist build *.egg

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    
# Custom markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests
    
# Asyncio support
asyncio_mode = auto
