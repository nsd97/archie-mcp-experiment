name: CI

on:
  pull_request:
  push:
    branches:
      - noahs-continued-work

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Lint
        run: npx eslint .
      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Generate OpenAPI
        run: node -e "console.log(JSON.stringify(require('./dist/openapi.js').buildOpenApiSpec()))" > openapi.json
      - name: Upload OpenAPI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi.json
          path: openapi.json
      # Optional spectral validation step can be added later
